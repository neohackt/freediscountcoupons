# Apache Virtual Host for Strapi API
# Save as: /etc/apache2/sites-available/api.yourdomain.com.conf
# Then: sudo a2ensite api.yourdomain.com && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName api.yourdomain.com
    ServerAlias www.api.yourdomain.com

    # Redirect all HTTP to HTTPS
    Redirect permanent / https://api.yourdomain.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.yourdomain.com
    ServerAlias www.api.yourdomain.com

    # SSL Configuration (Let's Encrypt certificates)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.yourdomain.com/privkey.pem

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # HSTS (enable after confirming HTTPS works)
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Proxy to Strapi (running on localhost:1337)
    ProxyPreserveHost On
    ProxyRequests Off

    # Main proxy rules
    ProxyPass / http://localhost:1337/
    ProxyPassReverse / http://localhost:1337/

    # WebSocket support (for Strapi real-time features if used)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://localhost:1337/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) http://localhost:1337/$1 [P,L]

    # Increase limits for media uploads
    LimitRequestBody 52428800

    # Timeouts
    ProxyTimeout 300
    ProxyBadHeader Ignore

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/api.yourdomain.com-error.log
    CustomLog ${APACHE_LOG_DIR}/api.yourdomain.com-access.log combined

    # Health check endpoint (optional - for monitoring)
    <Location /api/health>
        Require all granted
    </Location>
</VirtualHost>

# ============================================
# REQUIRED APACHE MODULES
# Enable with: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
# ============================================