# Apache Virtual Host for Frontend (Next.js)
# Save as: /etc/apache2/sites-available/freediscountcoupons.com.conf
# Then: sudo a2ensite freediscountcoupons.com && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName freediscountcoupons.com
    ServerAlias www.freediscountcoupons.com

    # Redirect all HTTP to HTTPS
    Redirect permanent / https://freediscountcoupons.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName freediscountcoupons.com
    ServerAlias www.freediscountcoupons.com

    # SSL Configuration (Let's Encrypt certificates)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/freediscountcoupons.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/freediscountcoupons.com/privkey.pem

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # HSTS (enable after confirming HTTPS works)
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Proxy to Next.js (running on localhost:3000)
    ProxyPreserveHost On
    ProxyRequests Off

    # Main proxy rules
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # WebSocket support (for Next.js HMR in dev, not needed in prod but harmless)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://localhost:3000/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) http://localhost:3000/$1 [P,L]

    # Timeouts
    ProxyTimeout 300
    ProxyBadHeader Ignore

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/freediscountcoupons.com-error.log
    CustomLog ${APACHE_LOG_DIR}/freediscountcoupons.com-access.log combined

    # Health check endpoint (optional - for monitoring)
    <Location /api/health>
        Require all granted
    </Location>
</VirtualHost>

# ============================================
# REQUIRED APACHE MODULES
# Enable with: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
# ============================================